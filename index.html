<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Sudo the Penguin</title>
    <meta name="description" content="Sudo is a tiny pixel penguin who lives at valerie.wtf. Drag fish to him, give him baths, play ball, and don't let him get sick.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">

    <style>
        /* one-screen handheld: status HUD on top, Sudo on the ice in the middle, item tray at the bottom */
        :root {
            --sky-hi: #1b2246;
            --sky-lo: #4f6fae;
            --ice: #e3f0fd;
            --ice-edge: #a8c3e6;
            --ink: #1a1c2c;
            --panel: #141a35;
            --panel-line: #2f3a68;
            --text: #eef3ff;
            --muted: #a3b3da;
            --beak: #f7963c;
            --good: #7bd88f;
            --warn: #f2c14e;
            --bad: #ef5b6b;
            --night: rgba(8, 10, 30, 0.55);

            --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
            --mono: "VT323", ui-monospace, "DejaVu Sans Mono", monospace;

            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body { height: 100%; }

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, var(--sky-hi) 0%, var(--sky-lo) 100%);
            background-color: var(--sky-hi);
            color: var(--text);
            font-family: var(--display);
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            height: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 12px;
            padding-block: 14px;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
        }

        /* ---------- header ---------- */

        .top { display: flex; align-items: center; gap: 12px; }
        .nameplate { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
        h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0.02em; text-wrap: balance; }
        .age { font-family: var(--mono); font-size: 20px; color: var(--muted); white-space: nowrap; }

        .mood {
            font-size: 14px;
            padding: 4px 10px;
            border: 2px solid var(--panel-line);
            background: var(--panel);
            white-space: nowrap;
        }
        .mood[data-level="bad"] { border-color: var(--bad); color: var(--bad); }
        .mood[data-level="warn"] { border-color: var(--warn); color: var(--warn); }
        .mood[data-level="good"] { border-color: var(--good); color: var(--good); }

        .icon-btn {
            font: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--panel);
            border: 2px solid var(--panel-line);
            padding: 4px 10px;
            cursor: pointer;
        }
        .icon-btn:hover { border-color: var(--muted); }

        /* ---------- stats ---------- */

        .stats {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 12px;
            background: var(--panel);
            border: 2px solid var(--panel-line);
        }

        .stat { display: grid; gap: 4px; min-width: 0; }
        .stat-head { display: flex; justify-content: space-between; gap: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
        .stat-head b { font-family: var(--mono); font-size: 18px; line-height: 12px; font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
        .meter { height: 10px; background: var(--ink); border: 2px solid var(--ink); }
        .meter i { display: block; height: 100%; width: 50%; background: var(--good); transition: width 0.4s steps(6); }
        .meter i[data-level="warn"] { background: var(--warn); }
        .meter i[data-level="bad"] { background: var(--bad); }

        /* ---------- scene ---------- */

        .scene {
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
        }

        .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
        .stars i { position: absolute; width: 3px; height: 3px; background: var(--ice); }
        .scene.night .stars { opacity: 1; }
        .scene::after { content: ""; position: absolute; inset: 0; background: var(--night); opacity: 0; transition: opacity 1.2s; pointer-events: none; }
        .scene.night::after { opacity: 1; }

        .say {
            position: relative;
            z-index: 2;
            max-width: min(100%, 340px);
            margin-bottom: 8px;
            padding: 8px 12px;
            background: var(--ice);
            color: var(--ink);
            border: 3px solid var(--ink);
            font-size: 16px;
            text-align: center;
            text-wrap: balance;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s, transform 0.2s;
        }
        .say.show { opacity: 1; transform: none; }
        .say::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -11px;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            background: var(--ice);
            border-right: 3px solid var(--ink);
            border-bottom: 3px solid var(--ink);
            transform: rotate(45deg) scaleY(0.8);
        }

        .stage { position: relative; z-index: 1; display: grid; justify-items: center; }

        #sudo {
            display: block;
            width: min(72vw, 44vh, 384px);
            height: auto;
            aspect-ratio: 1;
            max-width: 100%;
            image-rendering: pixelated;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        #sudo.target { transform: scale(1.06); filter: drop-shadow(0 0 10px var(--beak)); }
        #sudo:focus-visible { outline: 3px dashed var(--beak); outline-offset: 4px; }

        .floor {
            width: min(100%, 520px);
            height: 26px;
            margin-top: -14px;
            background: var(--ice);
            border: 3px solid var(--ink);
            border-radius: 50%;
            box-shadow: inset 0 -6px 0 var(--ice-edge);
        }

        .hint { position: relative; z-index: 2; margin: 10px 0 0; font-size: 14px; color: var(--muted); text-align: center; min-height: 1.3em; text-wrap: balance; }
        .scene.night .hint { color: var(--text); }

        .particle {
            position: absolute;
            z-index: 3;
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
            pointer-events: none;
            animation: float-up 1.3s ease-out forwards;
        }
        @keyframes float-up {
            from { opacity: 1; transform: translate(0, 0) scale(1); }
            to { opacity: 0; transform: translate(var(--dx, 0px), -90px) scale(1.4); }
        }

        /* ---------- tray ---------- */

        .tray {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .item {
            font: inherit;
            font-size: 14px;
            color: var(--text);
            display: grid;
            justify-items: center;
            gap: 2px;
            padding: 8px 4px 6px;
            background: var(--panel);
            border: 2px solid var(--panel-line);
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .item img { width: 48px; height: 48px; image-rendering: pixelated; pointer-events: none; -webkit-user-drag: none; }
        .item:hover { border-color: var(--muted); }
        .item:focus-visible { outline: 3px dashed var(--beak); outline-offset: 2px; }
        .item:active { cursor: grabbing; }
        .item.dragging img { opacity: 0.25; }
        .item[aria-pressed="true"] { border-color: var(--warn); }

        .ghost {
            position: fixed;
            z-index: 20;
            width: 64px;
            height: 64px;
            margin: -32px 0 0 -32px;
            image-rendering: pixelated;
            pointer-events: none;
            filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35));
        }
        .ghost.fly { transition: left 0.35s ease-in, top 0.35s cubic-bezier(.5, -0.6, .7, 1), opacity 0.35s; }

        /* ---------- diary ---------- */

        .diary {
            position: fixed;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 70%;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            max-width: 640px;
            margin: 0 auto;
            padding-top: 14px;
            padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            background: var(--panel);
            border: 2px solid var(--panel-line);
            border-bottom: 0;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }
        .diary-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .diary h2 { margin: 0; font-size: 22px; }
        .diary ol { margin: 0; padding: 0; list-style: none; overflow-y: auto; display: grid; gap: 2px; align-content: start; }
        .diary li { display: flex; gap: 12px; font-size: 15px; }
        .diary time { font-family: var(--mono); font-size: 18px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .diary .counts { font-size: 14px; color: var(--muted); }
        .diary a { color: var(--ice); }

        @media (max-width: 480px) {
            .app { gap: 10px; padding-block: 10px; }
            h1 { font-size: 24px; }
            .age { font-size: 17px; }
            .stats { gap: 6px; padding: 8px; }
            .stat-head { flex-direction: column; gap: 2px; font-size: 10px; letter-spacing: 0.04em; }
            .stat-head b { font-size: 16px; line-height: 1; }
            .item { font-size: 12px; }
            .item img { width: 40px; height: 40px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .particle { animation-duration: 0.01s; }
            .ghost.fly { transition: none; }
            .meter i { transition: none; }
        }
    </style>
</head>

<body>

    <main class="app">
        <header class="top">
            <div class="nameplate">
                <h1>Sudo</h1>
                <span class="age" id="age"></span>
            </div>
            <span class="mood" id="mood"></span>
            <button class="icon-btn" id="diaryBtn" type="button">Diary</button>
        </header>

        <section class="stats" id="stats" aria-label="Sudo's stats"></section>

        <section class="scene" id="scene">
            <div class="stars" id="stars"></div>
            <div class="say" id="say" role="status" aria-live="polite"></div>
            <div class="stage">
                <img id="sudo" src="sprites/idle_happy_1.png" alt="Sudo the penguin. Tap to pet him." tabindex="0" draggable="false">
                <div class="floor"></div>
            </div>
            <p class="hint" id="hint"></p>
        </section>

        <nav class="tray" aria-label="Things to give Sudo">
            <button class="item" type="button" data-item="fish"><img src="sprites/fish.png" alt="">Fish</button>
            <button class="item" type="button" data-item="soap"><img src="sprites/soap.png" alt="">Soap</button>
            <button class="item" type="button" data-item="ball"><img src="sprites/ball.png" alt="">Ball</button>
            <button class="item" type="button" data-item="pill"><img src="sprites/pill.png" alt="">Medicine</button>
            <button class="item" type="button" id="sleepBtn" aria-pressed="false"><img src="sprites/moon.png" alt=""><span>Sleep</span></button>
        </nav>
    </main>

    <aside class="diary" id="diary" hidden aria-label="Sudo's diary">
        <div class="diary-head">
            <h2>Sudo's diary</h2>
            <button class="icon-btn" id="diaryClose" type="button">Close</button>
        </div>
        <ol id="log"></ol>
        <div class="counts" id="counts"></div>
    </aside>

    <script>
        const $ = id => document.getElementById(id);
        const sudoEl = $("sudo");
        const sceneEl = $("scene");
        const sayEl = $("say");

        // ---------- sprites ----------

        const FRAMES = {
            idle_happy: 2, idle_neutral: 2, idle_hungry: 2, idle_sad: 2, idle_stinky: 2, idle_sleepy: 2,
            idle_sick: 2, idle_overfed: 2, idle_ecstatic: 2, blink: 1, pet: 2, eat: 3, bath: 2, play: 2, sleep: 2
        };
        for (const prefix of ["baby_", ""])
            for (const [name, n] of Object.entries(FRAMES))
                for (let i = 1; i <= n; i++) new Image().src = `sprites/${prefix}${name}_${i}.png`;

        // ---------- state ----------

        const STATS = { food: "Food", fun: "Fun", clean: "Clean", energy: "Energy", health: "Health" };

        // per-hour changes. a full tummy lasts about half a day.
        const DECAY = {
            awake:  { food: -6, fun: -5, clean: -3, energy: -4 },
            asleep: { food: -3, fun: -1, clean: -1, energy: 20 }
        };

        const MAX_CATCHUP_H = 24 * 14;
        const GROW_UP_H = 72;   // he's a fluffy baby for his first 3 days
        const SAVE_KEY = "sudo-pet";

        function freshPenguin() {
            const now = Date.now();
            return {
                born: now, last: now, asleep: false, overfedUntil: 0, grown: false,
                stats: { food: 70, fun: 70, clean: 90, energy: 80, health: 100 },
                counts: {}, log: []
            };
        }

        let sudo = null;
        let isNew = false;
        try { sudo = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
        if (!sudo || !sudo.stats) { sudo = freshPenguin(); isNew = true; }

        let grewUp = false;

        const ageMs = () => Date.now() - sudo.born;
        const isBaby = () => ageMs() < GROW_UP_H * 36e5;

        function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(sudo)); } catch (e) {} }

        const clamp = v => Math.max(0, Math.min(100, v));

        function bump(stat, by) { sudo.stats[stat] = clamp(sudo.stats[stat] + by); }

        // Advance time in small steps so health reacts to stats crossing thresholds mid-absence.
        function tick() {
            const now = Date.now();
            let hours = Math.min((now - sudo.last) / 36e5, MAX_CATCHUP_H);
            sudo.last = now;
            while (hours > 0) {
                const h = Math.min(hours, 0.25);
                hours -= h;
                const s = sudo.stats;
                for (const [k, v] of Object.entries(DECAY[sudo.asleep ? "asleep" : "awake"])) bump(k, v * h);
                if (s.food < 15 || s.clean < 15) bump("health", -6 * h);
                else if (s.food > 40 && s.clean > 40) bump("health", 3 * h);
                if (sudo.asleep && s.energy >= 100) { sudo.asleep = false; logEvent("woke up all on his own ☀️"); }
            }
            if (!sudo.grown && !isBaby()) {
                sudo.grown = true;
                grewUp = true;
                logEvent("grew up into a big penguin! 🐧");
            }
            save();
        }

        function logEvent(msg) {
            sudo.log.push({ t: Date.now(), msg });
            if (sudo.log.length > 50) sudo.log.shift();
        }

        function count(action) { sudo.counts[action] = (sudo.counts[action] || 0) + 1; }

        // ---------- mood ----------

        // [chip text, chip level, hint under Sudo]
        const MOODS = {
            sleep:         ["Asleep", "", "Shh, he's sleeping. He wakes up by himself once he's rested."],
            idle_sick:     ["Sick", "bad", "He's sick! Give him medicine, then feed him and clean him."],
            idle_overfed:  ["Too full", "warn", "Too many fish. Give his tummy a few minutes."],
            idle_hungry:   ["Starving", "bad", "He's hungry. Drag a fish to him."],
            idle_stinky:   ["Stinky", "warn", "Phew. Scrub him with the soap."],
            idle_sleepy:   ["Sleepy", "warn", "He can barely keep his eyes open. Tap the moon to put him to bed."],
            idle_sad:      ["Bored", "warn", "He's bored. Throw him the ball, or pet him."],
            idle_ecstatic: ["Best life", "good", "He's never been happier."],
            idle_happy:    ["Happy", "good", "Drag things onto Sudo, or tap him to pet him."],
            idle_neutral:  ["Okay", "", "Drag things onto Sudo, or tap him to pet him."]
        };

        function mood() {
            const s = sudo.stats;
            if (sudo.asleep) return "sleep";
            if (s.health < 40) return "idle_sick";
            if (Date.now() < sudo.overfedUntil) return "idle_overfed";
            if (s.food < 30) return "idle_hungry";
            if (s.clean < 30) return "idle_stinky";
            if (s.energy < 20) return "idle_sleepy";
            if (s.fun < 30) return "idle_sad";
            if (Object.values(s).every(v => v >= 80)) return "idle_ecstatic";
            if (s.fun >= 55) return "idle_happy";
            return "idle_neutral";
        }

        // ---------- rendering ----------

        let anim = null;
        let blinkUntil = 0;

        function animate(name, ms = 1600) { anim = { name, start: Date.now(), until: Date.now() + ms }; }

        function age() {
            const mins = Math.floor((Date.now() - sudo.born) / 6e4);
            const d = Math.floor(mins / 1440), h = Math.floor(mins / 60) % 24, m = mins % 60;
            const old = d ? `${d}d ${h}h old` : h ? `${h}h ${m}m old` : `${m}m old`;
            return isBaby() ? `baby · ${old}` : old;
        }

        const level = v => v < 30 ? "bad" : v < 60 ? "warn" : "good";

        $("stats").innerHTML = Object.entries(STATS).map(([k, label]) =>
            `<div class="stat"><div class="stat-head">${label}<b id="v-${k}"></b></div><div class="meter"><i id="m-${k}"></i></div></div>`).join("");

        function renderHud() {
            for (const k of Object.keys(STATS)) {
                const v = Math.round(sudo.stats[k]);
                $("v-" + k).textContent = v;
                const m = $("m-" + k);
                m.style.width = v + "%";
                m.dataset.level = level(v);
            }
            const [text, lvl, hint] = MOODS[mood()];
            $("mood").textContent = text;
            $("mood").dataset.level = lvl;
            $("hint").textContent = hint;
            $("age").textContent = age();
            sudoEl.alt = isBaby() ? "Baby Sudo, a fluffy penguin chick. Tap to pet him." : "Sudo the penguin. Tap to pet him.";
            if (grewUp) {
                grewUp = false;
                say("✨ Sudo grew up!! He's a big penguin now 🐧", 4500);
                burst("sparkle", 5);
            }
            sceneEl.classList.toggle("night", sudo.asleep);
            $("sleepBtn").setAttribute("aria-pressed", sudo.asleep);
            $("sleepBtn").querySelector("span").textContent = sudo.asleep ? "Wake" : "Sleep";
        }

        function renderSprite() {
            const now = Date.now();
            let name, frame;
            if (anim && now < anim.until) {
                name = anim.name;
                frame = Math.floor((now - anim.start) / 400) % FRAMES[name];
            } else {
                anim = null;
                name = mood();
                frame = Math.floor(now / 700) % FRAMES[name];
                const canBlink = !["sleep", "idle_overfed", "idle_sick"].includes(name);
                if (canBlink && now > blinkUntil + 2500 && Math.random() < 0.02) blinkUntil = now + 160;
                if (canBlink && now < blinkUntil) { name = "blink"; frame = 0; }
            }
            const src = `sprites/${isBaby() ? "baby_" : ""}${name}_${frame + 1}.png`;
            if (!sudoEl.src.endsWith(src)) sudoEl.src = src;
        }

        let sayTimer = 0;
        function say(msg, ms = 2600) {
            sayEl.textContent = msg;
            sayEl.classList.add("show");
            clearTimeout(sayTimer);
            sayTimer = setTimeout(() => sayEl.classList.remove("show"), ms);
        }

        // little sprites that float up off Sudo
        function burst(sprite, n = 3) {
            const box = sudoEl.getBoundingClientRect(), scene = sceneEl.getBoundingClientRect();
            for (let i = 0; i < n; i++) {
                const p = document.createElement("img");
                p.src = `sprites/${sprite}.png`;
                p.className = "particle";
                p.alt = "";
                p.style.left = (box.left - scene.left + box.width * (0.2 + Math.random() * 0.6) - 16) + "px";
                p.style.top = (box.top - scene.top + box.height * (0.15 + Math.random() * 0.35)) + "px";
                p.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
                p.style.animationDelay = (i * 0.12) + "s";
                sceneEl.appendChild(p);
                setTimeout(() => p.remove(), 1300 + i * 120);
            }
        }

        const pick = list => list[Math.floor(Math.random() * list.length)];

        // ---------- care ----------

        const ACTIONS = {
            feed() {
                if (sudo.asleep) return say("Shhh, he's sleeping 😴");
                if (sudo.stats.food >= 92) {
                    sudo.overfedUntil = Date.now() + 5 * 6e4;
                    bump("fun", -5);
                    logEvent("got force-fed and now has a tummy ache 🤢");
                    return say("He's too full! Now he has a tummy ache 🤢");
                }
                bump("food", 25);
                bump("health", 2);
                count("feed");
                logEvent("ate a fish 🐟");
                animate("eat", 1200);
                say(pick(["Nom nom nom 🐟", "*gulp* 🐟", "Fish! His favorite! 🐟", "He ate it in one bite 🐟"]));
            },

            pet() {
                count("pet");
                if (sudo.asleep) { bump("fun", 3); burst("heart", 1); return say("He smiles in his sleep 🥹"); }
                bump("fun", 10);
                logEvent("got petted 🥰");
                animate("pet", 1600);
                burst("heart");
                say(pick(["*happy wiggle*", "He leans into your hand 🥰", "*happy penguin noises*", "He's blushing. He's shy."]));
            },

            bathe() {
                if (sudo.asleep) return say("You can't bathe a sleeping penguin 😭");
                const wasStinky = sudo.stats.clean < 30;
                sudo.stats.clean = 100;
                bump("fun", 5);
                count("bathe");
                logEvent("had a bath 🫧");
                animate("bath", 2000);
                burst("bubble", 5);
                say(wasStinky ? "FINALLY. The fly has left ✨" : "Splish splash! Squeaky clean ✨");
            },

            play() {
                if (sudo.asleep) return say("He's asleep. Play later 😴");
                if (sudo.stats.health < 40) return say("He's too sick to play 🤒");
                if (sudo.stats.energy < 15) return say("He's too tired to play 🥱");
                bump("fun", 20);
                bump("energy", -12);
                bump("food", -5);
                count("play");
                logEvent("played ball 🎾");
                animate("play", 1600);
                burst("sparkle", 2);
                say(pick(["He bonked it with his head! 🎾", "BALL!!! 🎾", "He's thrilled 🎾"]));
            },

            heal() {
                if (sudo.asleep) return say("Let him sleep first 😴");
                if (sudo.stats.health >= 70) return say("He's healthy! No medicine needed 💚");
                bump("health", 40);
                count("heal");
                logEvent("took his medicine 💊");
                animate("idle_ecstatic", 1400);
                burst("sparkle", 3);
                say(sudo.stats.food < 15 || sudo.stats.clean < 15 ? "Much better! Now feed him and clean him 💊" : "Brave little guy. He feels much better 💊");
            },

            sleep() {
                if (sudo.asleep) {
                    sudo.asleep = false;
                    bump("fun", -10);
                    logEvent("got woken up 😠");
                    return say("He's awake, and grumpy about it 😠");
                }
                if (sudo.stats.energy > 80) return say("He refuses. He is NOT tired 😤");
                sudo.asleep = true;
                logEvent("went to sleep 💤");
                say("Goodnight, little guy 🌙");
            }
        };

        const ITEM_ACTION = { fish: "feed", soap: "bathe", ball: "play", pill: "heal" };

        function act(name) {
            tick();
            ACTIONS[name]();
            save();
            renderHud();
        }

        // ---------- dragging items onto Sudo ----------

        function overSudo(x, y) {
            const r = sudoEl.getBoundingClientRect();
            const pad = r.width * 0.1;
            return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
        }

        function makeGhost(item, x, y) {
            const g = document.createElement("img");
            g.src = `sprites/${item}.png`;
            g.className = "ghost";
            g.alt = "";
            g.style.left = x + "px";
            g.style.top = y + "px";
            document.body.appendChild(g);
            return g;
        }

        // fly a ghost to a point, then clean up
        function flyTo(g, x, y, done) {
            g.classList.add("fly");
            requestAnimationFrame(() => { g.style.left = x + "px"; g.style.top = y + "px"; });
            setTimeout(() => { g.remove(); done && done(); }, 360);
        }

        function sudoCenter() {
            const r = sudoEl.getBoundingClientRect();
            return [r.left + r.width / 2, r.top + r.height * 0.55];
        }

        // tapping (or pressing Enter on) an item tosses it to Sudo
        function toss(btn) {
            const item = btn.dataset.item;
            const r = btn.getBoundingClientRect();
            const g = makeGhost(item, r.left + r.width / 2, r.top + r.height / 2);
            const [x, y] = sudoCenter();
            flyTo(g, x, y, () => act(ITEM_ACTION[item]));
        }

        let drag = null;

        document.querySelectorAll(".item[data-item]").forEach(btn => {
            btn.addEventListener("pointerdown", e => {
                if (e.button > 0) return;
                e.preventDefault();
                btn.setPointerCapture(e.pointerId);
                drag = { btn, item: btn.dataset.item, x0: e.clientX, y0: e.clientY, ghost: null, over: false, lastBubble: 0 };
            });

            btn.addEventListener("pointermove", e => {
                if (!drag || drag.btn !== btn) return;
                if (!drag.ghost) {
                    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
                    drag.ghost = makeGhost(drag.item, e.clientX, e.clientY);
                    btn.classList.add("dragging");
                }
                drag.ghost.style.left = e.clientX + "px";
                drag.ghost.style.top = e.clientY + "px";
                drag.over = overSudo(e.clientX, e.clientY);
                sudoEl.classList.toggle("target", drag.over);
                // scrubbing with the soap makes bubbles
                if (drag.over && drag.item === "soap" && Date.now() - drag.lastBubble > 220) {
                    drag.lastBubble = Date.now();
                    burst("bubble", 1);
                }
            });

            const end = e => {
                if (!drag || drag.btn !== btn) return;
                const d = drag;
                drag = null;
                btn.classList.remove("dragging");
                sudoEl.classList.remove("target");
                if (e.type === "pointercancel") { d.ghost && d.ghost.remove(); return; }
                if (!d.ghost) { toss(btn); return; }
                if (d.over) {
                    const [x, y] = sudoCenter();
                    flyTo(d.ghost, x, y, () => act(ITEM_ACTION[d.item]));
                } else {
                    const r = btn.getBoundingClientRect();
                    flyTo(d.ghost, r.left + r.width / 2, r.top + r.height / 2);
                }
            };
            btn.addEventListener("pointerup", end);
            btn.addEventListener("pointercancel", end);

            // keyboard: Enter / Space fire a click with no pointer
            btn.addEventListener("click", e => { if (e.detail === 0) toss(btn); });
        });

        $("sleepBtn").addEventListener("click", () => act("sleep"));
        sudoEl.addEventListener("click", () => act("pet"));
        sudoEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act("pet"); } });

        // ---------- diary ----------

        function stamp(t) {
            const d = new Date(t);
            return d.toLocaleString("en-US", { month: "short", day: "2-digit" }) + " " + d.toTimeString().slice(0, 5);
        }

        function renderDiary() {
            const ol = $("log");
            ol.innerHTML = "";
            for (const e of sudo.log.slice().reverse()) {
                const li = document.createElement("li");
                const time = document.createElement("time");
                time.textContent = stamp(e.t);
                li.append(time, document.createTextNode(e.msg));
                ol.appendChild(li);
            }
            const c = sudo.counts;
            const hoursLeft = Math.ceil((GROW_UP_H * 36e5 - ageMs()) / 36e5);
            const days = Math.floor(hoursLeft / 24);
            const growing = isBaby() ? `Grows up in ${days ? days + "d " : ""}${hoursLeft % 24}h 🐣<br>` : "";
            $("counts").innerHTML = growing + `Fish eaten: ${c.feed || 0} · Pets: ${c.pet || 0} · Baths: ${c.bathe || 0} · Ball games: ${c.play || 0}<br>
                Also on valerie.wtf: <a href="game/">Package Panic</a> · <a href="archive/terminal-v2.html">the old terminal</a>`;
        }

        $("diaryBtn").addEventListener("click", () => { renderDiary(); $("diary").hidden = false; $("diaryClose").focus(); });
        $("diaryClose").addEventListener("click", () => { $("diary").hidden = true; $("diaryBtn").focus(); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") $("diary").hidden = true; });

        // ---------- boot ----------

        const stars = $("stars");
        for (let i = 0; i < 28; i++) {
            const s = document.createElement("i");
            s.style.left = Math.random() * 100 + "%";
            s.style.top = Math.random() * 60 + "%";
            s.style.opacity = 0.4 + Math.random() * 0.6;
            stars.appendChild(s);
        }

        tick();
        // if he just grew up, renderHud announces that instead
        if (isNew) {
            logEvent("hatched! 🐣");
            save();
            setTimeout(() => say("🐣 Sudo hatched! He's a tiny baby. Look after him and he'll grow up in 3 days!", 4500), 400);
        } else if (!grewUp) {
            setTimeout(() => say(`Welcome back! ${MOODS[mood()][2]}`, 3500), 400);
        }

        renderHud();
        renderSprite();
        setInterval(renderSprite, 100);
        setInterval(() => { tick(); renderHud(); }, 10000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); renderHud(); } });
    </script>

</body>
