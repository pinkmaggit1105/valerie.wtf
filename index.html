<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>valerie.wtf</title>
    <meta name="description" content="Tiny pixel pets live here: Sudo the penguin and Puck the goose. Pick one to look after.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">

    <style>
        /* a night sky over a row of pet cards, each card a little window into that pet's world */
        :root {
            --sky-top: #0b1030;
            --sky-bottom: #2a3a78;
            --ink: #1a1c2c;
            --panel: #141a35;
            --panel-line: #2f3a68;
            --text: #eef3ff;
            --muted: #a3b3da;
            --beak: #f7963c;
            --good: #7bd88f;
            --warn: #f2c14e;
            --bad: #ef5b6b;

            --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
            --mono: "VT323", ui-monospace, "DejaVu Sans Mono", monospace;

            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        html { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100%;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%) fixed;
            background-color: var(--sky-top);
            color: var(--text);
            font-family: var(--display);
            font-size: 16px;
        }

        /* little pixel stars */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, #fff 1px, transparent 1.5px),
                radial-gradient(circle, #ffe9a8 1px, transparent 1.5px);
            background-size: 97px 89px, 151px 137px;
            background-position: 13px 21px, 61px 47px;
            opacity: 0.55;
        }

        main {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding-block: 48px 32px;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            display: grid;
            gap: 32px;
        }

        header { display: grid; gap: 8px; text-align: center; }
        h1 { margin: 0; font-size: clamp(40px, 9vw, 64px); line-height: 1; letter-spacing: 0.02em; text-shadow: 0 4px 0 var(--ink); }
        .tagline { margin: 0; font-size: 18px; color: var(--muted); text-wrap: balance; }

        .pets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }

        .card {
            display: grid;
            grid-template-rows: auto 1fr;
            color: inherit;
            text-decoration: none;
            background: var(--panel);
            border: 3px solid var(--panel-line);
            box-shadow: 0 6px 0 var(--ink);
            transition: transform 0.12s, border-color 0.12s;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--muted); }
        .card:focus-visible { outline: 3px dashed var(--beak); outline-offset: 4px; }

        .portrait {
            position: relative;
            height: 200px;
            display: grid;
            place-items: end center;
            background: linear-gradient(180deg, var(--sky) 0 70%, var(--line) 70% 72%, var(--ground) 72%);
            border-bottom: 3px solid var(--ink);
            overflow: hidden;
        }
        .sprite { position: relative; width: 192px; height: 192px; margin-bottom: -6px; }
        .sprite img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

        .card-body { display: grid; gap: 10px; align-content: start; padding: 16px 18px 18px; }
        .card h2 { margin: 0; font-size: 28px; line-height: 1; }
        .card h2 small { font-size: 16px; font-weight: 400; color: var(--muted); }

        .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
        .chip { font-size: 13px; padding: 3px 8px; border: 2px solid var(--panel-line); white-space: nowrap; }
        .chip[data-level="bad"] { border-color: var(--bad); color: var(--bad); }
        .chip[data-level="warn"] { border-color: var(--warn); color: var(--warn); }
        .chip[data-level="good"] { border-color: var(--good); color: var(--good); }
        .age { font-family: var(--mono); font-size: 19px; color: var(--muted); }

        .hint { margin: 0; font-size: 15px; text-wrap: balance; }

        .bars { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 6px; }
        .bar { display: grid; gap: 3px; min-width: 0; }
        .bar span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meter { height: 8px; background: var(--ink); border: 2px solid var(--ink); }
        .meter i { display: block; height: 100%; background: var(--good); }
        .meter i[data-level="warn"] { background: var(--warn); }
        .meter i[data-level="bad"] { background: var(--bad); }

        .blurb { margin: 0; font-size: 14px; color: var(--muted); }
        .go { justify-self: start; margin-top: 4px; padding: 6px 12px; background: var(--beak); color: var(--ink); border: 2px solid var(--ink); font-size: 16px; }

        footer { text-align: center; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
        footer a { color: var(--text); }

        @media (prefers-reduced-motion: reduce) {
            .card { transition: none; }
            .card:hover { transform: none; }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>valerie.wtf</h1>
            <p class="tagline">Tiny pixel pets live here. Pick one to look after.</p>
        </header>

        <section class="pets" id="pets" aria-label="Pets"></section>

        <footer>
            <p>Each pet's stats keep changing while you're away, so check on them now and then.</p>
            <p>valerie.wtf used to be a Linux terminal. It's still around in the <a href="archive/terminal-v2.html">archive</a>.</p>
        </footer>
    </main>

    <script src="shared/core.js"></script>
    <script src="sudo/config.js"></script>
    <script src="puck/config.js"></script>
    <script>
        const core = window.PetCore;
        const level = v => v < 30 ? "bad" : v < 60 ? "warn" : "good";
        const cards = [];

        for (const [id, cfg] of Object.entries(window.PETS)) {
            const a = document.createElement("a");
            a.className = "card";
            a.href = `${id}/`;
            a.innerHTML = `
                <div class="portrait" style="--sky: ${cfg.card.sky}; --ground: ${cfg.card.ground}; --line: ${cfg.card.line}">
                    <div class="sprite"><img class="body" alt=""></div>
                </div>
                <div class="card-body">
                    <h2>${cfg.name} <small>the ${cfg.species}</small></h2>
                    <div class="status"><span class="chip"></span><span class="age"></span></div>
                    <p class="hint"></p>
                    <div class="bars"></div>
                    <p class="blurb">${cfg.blurb}</p>
                    <span class="go">Visit ${cfg.name} →</span>
                </div>`;
            document.getElementById("pets").appendChild(a);
            cards.push({ id, cfg, a });
        }

        // what each pet looks like right now. Time is caught up on a copy, so their own page still
        // gets to announce anything that happened while you were away.
        function render() {
            for (const { cfg, a } of cards) {
                const { state, isNew } = core.load(cfg);
                const s = structuredClone(state);
                core.tick(s, cfg);
                const [chip, lvl, hint] = core.moodInfo(s, cfg);
                a.querySelector(".chip").textContent = isNew ? "New" : chip;
                a.querySelector(".chip").dataset.level = isNew ? "good" : lvl;
                a.querySelector(".age").textContent = isNew ? "an egg is waiting" : core.ageText(s, cfg);
                a.querySelector(".hint").textContent = isNew ? `There's an egg waiting for someone to keep it warm. Go say hi to ${cfg.name}!` : hint;
                a.setAttribute("aria-label", `${cfg.name} the ${cfg.species}: ${isNew ? "an egg waiting to hatch" : chip}. Visit ${cfg.name}.`);

                const [labels, values] = core.statSet(s);
                const bars = a.querySelector(".bars");
                bars.style.setProperty("--cols", Object.keys(labels).length);
                bars.innerHTML = Object.entries(labels).map(([k, label]) => {
                    const v = Math.round(values[k]);
                    return `<div class="bar"><span>${label} ${v}</span><div class="meter"><i style="width: ${v}%" data-level="${k === "progress" ? "good" : level(v)}"></i></div></div>`;
                }).join("");

                // the sprite, plus whatever they're wearing
                const name = core.mood(s);
                const box = a.querySelector(".sprite");
                box.dataset.name = name;
                box.dataset.prefix = core.prefix(s, cfg, name);
                box.dataset.dir = cfg.spriteDir;
                box.querySelectorAll(".acc").forEach(el => el.remove());
                if (s.hatched)
                    for (const slot of ["neck", "face", "head"])
                        if (s.wearing[slot]) box.insertAdjacentHTML("beforeend", `<img class="acc" alt="" src="${cfg.spriteDir}${core.prefix(s, cfg, name)}acc_${s.wearing[slot]}.png">`);
            }
            frame();
        }

        // gentle two-frame idle animation, like on their own pages
        const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let tickN = 0;
        function frame() {
            const f = still ? 0 : tickN % 2;
            for (const box of document.querySelectorAll(".sprite")) {
                const frames = box.dataset.name === "blink" ? 1 : 2;
                box.querySelector(".body").src = `${box.dataset.dir}${box.dataset.prefix}${box.dataset.name}_${(f % frames) + 1}.png`;
                box.querySelectorAll(".acc").forEach(el => { el.style.transform = `translateY(${f * 6}px)`; });
            }
        }

        render();
        setInterval(() => { tickN++; frame(); }, 700);
        setInterval(render, 30000);
        addEventListener("pageshow", render);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
    </script>
</body>

</html>
